<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Misión Emprende · Feria TP 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f8f4ef;--paper:#fffdfa;--ink:#2b1d1a;--ink2:#5a4740;--mute:#9a8880;--line:#ece2d8;--line2:#f3ebe3;
  --wine:#7a2737;--wine2:#5e1c29;--winebg:#f6e7ea;
  --ok:#4f7a4a;--okbg:#e9f1e4;--warn:#b0623a;
  --t:#ede0d1;--t2:#8a6248;--t3:#f6eee6;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body[data-site="G8"]{--t:#f5dde1;--t2:#b0556a;--t3:#fbf0f1}
body[data-site="Torre C"]{--t:#e6def3;--t2:#7a5ea8;--t3:#f4f0fa}
body[data-site="BTS 0"]{--t:#f6eac0;--t2:#9c7a17;--t3:#fbf6e3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.nav{max-width:1180px;margin:0 auto;padding:22px 32px;display:flex;align-items:center;gap:16px}
.mark{font-family:var(--serif);font-size:24px;letter-spacing:-.01em;line-height:1}
.mark i{font-style:italic;color:var(--wine)}
.navsub{color:var(--mute);font-size:12.5px;border-left:1px solid var(--line);padding-left:14px;margin-left:2px}
.nav .sp{flex:1}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 10px}
.sync .d{width:7px;height:7px;border-radius:50%;background:#cbbdb4}
.sync.on .d{background:var(--ok)} .sync.err .d{background:var(--warn)} .sync.busy .d{background:#d8b24a}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:34px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.ghost:hover{border-color:#dccfc3}

.wrap{max-width:1180px;margin:0 auto;padding:6px 32px 90px}

/* site cards */
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 0 34px}
.sc{position:relative;border:1px solid transparent;border-radius:22px;padding:22px 22px 20px;text-align:left;background:var(--c);transition:transform .2s, box-shadow .2s;overflow:hidden}
.sc:hover{transform:translateY(-2px)}
.sc.on{box-shadow:0 0 0 2px var(--ink) inset}
.sc .lb{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--k);font-weight:700}
.sc h2{font-family:var(--serif);font-weight:500;font-size:36px;margin:6px 0 2px;letter-spacing:-.02em;line-height:1}
.sc .who{font-size:13px;color:var(--ink2)}
.sc .pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;font-size:12.5px;color:var(--ink2)}
.sc .pr b{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink)}
.sc .bar{height:4px;border-radius:4px;background:rgba(43,29,26,.1);margin-top:8px;overflow:hidden}
.sc .bar i{display:block;height:100%;background:var(--k);border-radius:4px;transition:width .4s}
.sc .blob{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35)}

/* head of list */
.head{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:-.025em;margin:0;line-height:1}
.head h1 em{font-style:italic;color:var(--t2)}
.head p{margin:8px 0 0;color:var(--mute)}
.head .sp{flex:1}
.stats{display:flex;gap:28px}
.stat span{display:block;font-size:11.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stat b{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1}
.stat b small{font-family:var(--sans);font-size:13px;color:var(--mute);font-weight:500}

.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.seg em{font-style:normal;opacity:.6;margin-left:5px}
.pf{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;height:36px;padding:0 6px 0 13px}
.pf label{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.pf input{border:0;outline:none;background:transparent;font:inherit;font-size:13px;font-weight:600;width:120px;color:var(--ink)}
#lim{width:175px}
.pf input::placeholder{color:#c4b6ad;font-weight:500}
.bar2 .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:36px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#d9cbbf}
.btn.wine{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.wine:hover{background:var(--wine2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}

/* list */
.list{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 130px 230px;gap:16px;align-items:center;padding:16px 22px;border-top:1px solid var(--line2);cursor:pointer;transition:background .15s}
.row:first-child{border-top:0}
.row:hover{background:var(--t3)}
.rk{font-family:var(--serif);font-size:18px;color:var(--mute)}
.e{display:flex;align-items:center;gap:13px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--t);color:var(--t2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;flex:none}
.e b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e span{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .why{color:var(--warn);font-size:12px}
.ap{font-size:13px;min-width:0}
.ap small{display:block;font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.ap div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ap.no div{color:var(--wine)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-p{background:#f3ede7;color:#9a8880}
.t-s{background:var(--t);color:var(--t2)}
.t-o{background:var(--okbg);color:var(--ok)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none}
.ic:hover{border-color:#d9cbbf}
.ic.on{background:var(--okbg);border-color:#cfe0c8;color:var(--ok)}
.ic.wa.done{background:var(--t);border-color:transparent;color:var(--t2)}
.empty{padding:44px;text-align:center;color:var(--mute)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(43,29,26,.28);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:12px;right:12px;bottom:12px;width:540px;max-width:calc(100% - 24px);background:var(--paper);border-radius:24px;z-index:21;transform:translateX(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -30px rgba(43,29,26,.45)}
.dr.on{transform:none}
.dh{background:var(--t);padding:24px 26px 22px;position:relative}
.dh .lb{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);font-weight:700}
.dh h3{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.02em;margin:6px 40px 2px 0;line-height:1.1}
.dh p{margin:0;color:var(--ink2);font-size:13px}
.dh .x{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.6);border-color:transparent}
.db{flex:1;overflow-y:auto;padding:22px 26px}
.blk{margin-bottom:24px}
.blk h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.blk h4 button{border:0;background:none;color:var(--wine);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding:0}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 14px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl label{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}
.fl input,.fl textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;outline:none;background:#fff;color:var(--ink);resize:vertical}
.fl input:focus,.fl textarea:focus{border-color:var(--t2);box-shadow:0 0 0 3px var(--t3)}
.fl textarea.mail{min-height:330px;line-height:1.6;font-size:13.5px}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--t3);cursor:pointer;font-weight:600;font-size:13.5px}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.df{display:flex;gap:8px;padding:16px 26px;border-top:1px solid var(--line)}
.df .btn{flex:1;height:46px;font-size:14px}
.note{font-size:12.5px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2)}
.chips button:hover{border-color:var(--t2);color:var(--t2)}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:12px;font-size:13.5px;color:var(--ink2)}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--t);color:var(--t2);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.okl{list-style:none;margin:0;padding:0}
.okl li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px}
.okl li:first-child{border-top:0}
.okl span{color:var(--mute);font-size:12.5px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){#mailerTxt{display:none}
  .nav,.wrap{padding-left:16px;padding-right:16px}.navsub{display:none}
  .sites{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:24px}.sc{padding:14px 12px;border-radius:16px}.sc h2{font-size:22px;margin:0}.sc .who,.sc .lb,.sc .blob,.sc .pr>span{display:none}.sc .pr{margin-top:8px}.sc .pr b{font-size:15px}
  .head h1{font-size:32px}.stats{gap:18px;width:100%}.stat b{font-size:24px}
  .pf{flex:1 1 100%}.pf input{flex:1;width:auto;min-width:0}.bar2 .btn{flex:1}
  .row{grid-template-columns:30px 1fr auto;gap:10px;padding:14px 16px}
  .row .ap{grid-column:2/3}.row .st{grid-column:3;grid-row:1;align-self:start}.row .acts{grid-column:2/-1;justify-content:flex-start}
  .rk{font-size:15px}
  .dr{top:0;right:0;bottom:0;max-width:100%;width:100%;border-radius:0}
}
.stsel{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:6px 26px 6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;background-repeat:no-repeat;background-position:right 9px center;background-size:9px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%237a6a62' stroke-width='1.6'/></svg>")}
.stsel:focus{outline:2px solid var(--t)}
.s-pend{background-color:#f1ebe5;color:#8c7b72}
.s-env{background-color:var(--t);color:var(--t2)}
.s-conf{background-color:var(--okbg);color:var(--ok)}
.s-nores{background-color:#fbe9df;color:#b0623a}
.s-decl{background-color:#efe9ee;color:#7d6b78}
@media(min-width:901px){.row{grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 150px 240px}.acts .ic{flex:none}}
.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f8f4ef}
.preview .pv{zoom:.78;outline:none}
.preview .pv[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--t)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--t3);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink2);margin-top:10px}
.hint b{color:var(--ink)}
.kbd{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
.rem{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tframe{width:100%;height:520px;border:1px solid var(--line);border-radius:16px;background:#f8f4ef}
.cfgrow{display:grid;gap:12px}
@media(max-width:900px){.row{grid-template-columns:30px minmax(0,1fr) auto}.row .e{grid-column:2/-1}.row .ap{grid-column:2/3;grid-row:2}.row .st{grid-column:3;grid-row:2;align-self:center}.row .acts{grid-column:2/-1;grid-row:3}.preview .pv{zoom:.6}}
#setup{max-width:820px;margin:40px auto 80px;padding:0 24px}
.sv-k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);font-weight:700}
.sv h1{font-family:var(--serif);font-weight:400;font-size:52px;letter-spacing:-.025em;line-height:1.05;margin:12px 0 14px}
.sv h1 em{color:var(--wine)}
.sv>p{color:var(--ink2);font-size:16px;max-width:600px;margin:0 0 34px}
.sv-steps{display:grid;gap:14px}
.sv-s{display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 24px}
.sv-s>b{width:40px;height:40px;border-radius:50%;background:#ecdfd0;color:#8a6248;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:500}
.sv-s.done>b{background:var(--okbg);color:var(--ok)}
.sv-s h3{margin:0 0 3px;font-size:16px;font-weight:600}
.sv-s p{margin:0;color:var(--mute);font-size:13.5px}
@media(max-width:700px){.sv h1{font-size:36px}.sv-s{grid-template-columns:40px 1fr}.sv-s .btn{grid-column:1/-1}}
.sv-key{display:flex;gap:10px;max-width:460px}
.sv-key input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 18px;height:48px;font:inherit;font-size:15px;outline:none;letter-spacing:.06em}
.sv-key input:focus{border-color:#c9b3a4;box-shadow:0 0 0 4px #f1e6dc}
.sv-key .btn{height:48px;padding:0 26px;font-size:14px}
.sv-msg{margin-top:12px;color:var(--wine);font-size:13.5px;min-height:20px}

.e .lnk{display:inline-block;margin-top:2px;font-size:12px;color:var(--t2);text-decoration:none;font-weight:600}
.e .lnk:hover{text-decoration:underline}
.e .lnk.off{color:var(--mute);font-weight:500}
.about p{margin:0;font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-line}
.about h4 a{color:var(--wine);text-decoration:none;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.about .meta-l{margin-top:10px;font-size:12px;color:var(--mute)}

.about .nota{margin-top:10px;font-size:12.5px;font-weight:600;color:var(--warn);background:#fbf0e6;border-radius:10px;padding:8px 12px}

.sel{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink);outline:none}

.ic.nq:hover{color:var(--wine);border-color:#e3c3c9;background:#fbf0f1}
.s-nq{background-color:#efe9ee;color:#7d6b78}

.s-port{background-color:#e8f3ec;color:#3f7a58}
.s-rec{background-color:#e3eef8;color:#3c6a93}

.falta{padding:14px 22px;background:#fbf0e6;color:#7a4a1a;font-size:13px;border-bottom:1px solid var(--line2)}

.ask{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--paper);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(43,29,26,.45);border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.2s;z-index:45;font-size:14px;max-width:calc(100% - 24px)}
.ask.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sent-l{margin-top:10px;font-size:12.5px;color:var(--mute)}
.sent-l b{color:var(--ink2)}
.lk{border:0;background:none;padding:0;color:var(--wine);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}

.ask.big{bottom:50%;transform:translate(-50%,50%);width:440px}
.ask.big.on{transform:translate(-50%,50%)}
.dq{display:flex;flex-direction:column;gap:10px;width:100%;padding:6px 6px 6px 0}
.dqb{display:flex;gap:8px;justify-content:flex-end}

.row.hueco{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.015) 10px 20px)}
.row.hueco .av{background:var(--line2);color:var(--mute)}
.row.hueco:hover{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.015) 10px 20px)}
</style>
</head>
<body>
<nav class="nav">
  <div class="mark">Misión <i>Emprende</i></div>
  <div class="navsub">Feria de Emprendimiento TP 2026</div>
  <span class="sp"></span>
  <button class="ghost" id="mailerBtn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7.5 8 5.5 8-5.5"/></svg><span id="mailerTxt"></span></button>
  <button class="sync" id="syncBtn"><span class="d"></span><span id="syncTxt">Drive</span></button>
</nav>
<section id="setup" style="display:none"></section>
<div class="wrap" id="main">
  <section class="sites" id="sites"></section>
  <section class="head">
    <div><h1 id="h1"></h1><p id="sub"></p></div>
    <span class="sp"></span>
    <div class="stats" id="stats"></div>
  </section>
  <section class="bar2">
    <div class="seg" id="seg"></div>
    <span class="sp"></span>
    <button class="btn" id="addBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar</button>
    <button class="btn" id="pasteBtn"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h3"/></svg>Cargar respuesta</button>
    <button class="btn" id="tplBtn"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Plantilla y fechas</button>

function apoyoPre(d){const r=R(d),ap=r.apoyo.trim();return {apoyo:ap,atel:r.atel||((ap&&ap===d.apoyo&&d.apoyoTel&&d.apoyoTel.replace(/\D/g,"")!==d.tel)?d.apoyoTel:""),paren:r.paren||((ap&&ap===d.apoyo&&d.rel)?relTxt(d.rel):"")};}
function formulario(d){const pre=apoyoPre(d);return FORM.map(([k,l])=>`${l}: ${pre[k]||""}`.trimEnd()).join("\n");}
function datosTxt(d){const p=apoyoPre(d);
  return [`- Nombre: ${d.nombre}`,`- Celular: ${d.tel}`,`- Correo: ${d.email}`,`- Emprendimiento: ${nice(d.emp)}`,`- Categoría: ${d.sub}`,
    p.apoyo?`- Acompañante registrado: ${p.apoyo}${p.atel?`, cel. ${p.atel}`:""}${p.paren?` (${p.paren.toLowerCase()})`:""}`:`- Acompañante registrado: no registraste a nadie`].join("\n");}
function pedido(d){const ap=R(d).apoyo.trim();return ["Confirmar tu participación.","Tu campaña y tu horario laboral.",ap?`Confirmar si ${ap} te acompañará en el stand.`:"Nombre completo, celular y parentesco de quien te acompañará en el stand."];}
const mailText=d=>R(d).custom||fill(C(d.site).mail,vars(d));
const comida=d=>d.food||/ancheta|desayuno sorpresa|desayunos sorpresa|picada|licor|vino|cerveza/i.test([d.emp,d.sub,d.desc].join(" "));
const WA_FOOD="Importante: como tu emprendimiento es de alimentos o anchetas, todos los productos deben venir muy bien empacados y sellados para la venta. No se pueden exhibir ni vender productos destapados o al aire libre. Está completamente prohibido traer, exhibir o vender licores o bebidas alcohólicas, vapeadores, cigarrillos o productos similares, incluso dentro de anchetas o regalos.";
const waText=d=>{let t=fill(C(d.site).wa,vars(d)); if(comida(d)&&!t.includes("empacados")) t=/¡Muchas gracias!/.test(t)?t.replace(/\n*(¡Muchas gracias!)/,"\n\n"+WA_FOOD+"\n\n$1"):t+"\n\n"+WA_FOOD; return t;};
const waURL=(d,txt)=>{let n=d.tel.replace(/\D/g,"");if(n.length===10)n="57"+n;return `https://wa.me/${n}?text=${encodeURIComponent(txt)}`;};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const pdfName=d=>`Ficha_${nice(d.emp).replace(/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ ]/g,"").trim().replace(/\s+/g,"_").slice(0,40)}.pdf`;
function buildPDF(d){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
  const r=R(d), c=C(d.site), [bg,k]=THEME[d.site], ap=r.apoyo.trim();
  const W=612, M=56; let y=0;
  const ink=[43,29,26], mute=[140,125,118], line=[230,221,212];
  doc.setFillColor(...hex(bg)); doc.rect(0,0,W,8,"F");
  y=62;
  doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...hex(k));
  doc.text("FERIA DE EMPRENDIMIENTO TP 2026  ·  MISIÓN EMPRENDE",M,y,{charSpace:1});
  y+=30; doc.setFont("times","normal"); doc.setFontSize(26); doc.setTextColor(...ink);
  doc.text("Ficha de inscripción",M,y);
  y+=22; doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...mute);
  doc.text(`${nice(d.emp)}  ·  Site ${d.site}`,M,y);
  y+=26; doc.setDrawColor(...line); doc.setLineWidth(.8); doc.line(M,y,W-M,y);
  const section=(title)=>{y+=30;doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(...hex(k));doc.text(title.toUpperCase(),M,y,{charSpace:1});y+=8;};
  const field=(label,val,pending)=>{
    const lines=doc.splitTextToSize(String(val||"—"),W-M*2-150);
    y+=18; doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...mute); doc.text(label,M,y);
    doc.setFont("helvetica",pending?"italic":"bold"); doc.setTextColor(...(pending?mute:ink)); doc.text(lines,M+150,y);
    y+=(lines.length-1)*13+8; doc.setDrawColor(...line); doc.setLineWidth(.4); doc.line(M,y,W-M,y);
  };
  section("Datos del colaborador");
  field("Nombre completo",d.nombre); field("Celular",d.tel); field("Correo",d.email); field("Site",d.site);
  section("Emprendimiento");
  field("Nombre",nice(d.emp)); field("Categoría",d.sub);
  const desc=d.desc.length>420?d.desc.slice(0,417).trim()+"…":d.desc; field("Descripción",desc?desc.charAt(0).toUpperCase()+desc.slice(1):"—");
  section("Persona que atenderá el stand");
  const apTel=(ap&&ap===d.apoyo&&d.apoyoTel&&d.apoyoTel.replace(/\D/g,"")!==d.tel)?d.apoyoTel:"";
  field("Nombre",ap||"Por definir",!ap);
  if(apTel) field("Celular",apTel);
  if(ap&&ap===d.apoyo&&d.rel) field("Parentesco",d.rel.replace("Hermano/a","Hermano(a)").replace("Esposo/a","Esposo(a)"));
  section("Información pendiente por enviar");
  const pend=pedido(d); pend.forEach((x,i)=>{y+=20;doc.setFillColor(...hex(bg));doc.circle(M+8,y-4,8,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...hex(k));doc.text(String(i+1),M+8,y-1,{align:"center"});
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...ink);const l=doc.splitTextToSize(x,W-M*2-30);doc.text(l,M+26,y);y+=(l.length-1)*13;});
  y+=34; doc.setFillColor(...hex(bg)); const boxH=58; doc.roundedRect(M,y,W-M*2,boxH,8,8,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...ink); doc.text("¿Algún dato no es correcto?",M+16,y+22);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text(doc.splitTextToSize(`Respóndenos el correo indicando la corrección. Plazo para responder: ${c.lim.trim()}.`,W-M*2-32),M+16,y+38);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...mute);
  doc.text(`${c.resp.trim()}  ·  Emotions & Experiences  ·  TP`,M,760);
  doc.text(new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}),W-M,760,{align:"right"});
  return doc;
}
function downloadPDF(d){ try{buildPDF(d).save(pdfName(d));return true;}catch(e){toast("No se pudo crear el PDF");return false;} }
const mailSent=r=>!!r.msent||["env","nores"].includes(r.st);
const waSent=r=>!!r.sent;
function sendMail(d){ askSent(d,"mail"); }
function goURL(u){ if(/^mailto:/.test(u)){location.href=u;return;} const l=document.createElement("a"); l.href=u; l.target="_blank"; l.rel="noopener"; document.body.appendChild(l); l.click(); l.remove(); }
function noselMail(d){
  const c=C(d.site), v=vars(d), body=fill(c.nmail,v), r=R(d);
  if(mailSent(r)&&threadURL(d)){ copyText(body); goURL(threadURL(d)); toast("Correo copiado · abre la conversación, toca Responder y pega con Ctrl+V",6000); }
  else { const u=compose(d.email,fill(c.nsubj,v),body); goURL(u); }
  const q=$("ask");
  q.innerHTML=`<span>¿Enviaste el correo de no selección a <b>${esc(nice(d.emp))}</b>?</span><button class="btn wine" id="askY">Sí, lo envié</button><button class="btn" id="askN">No</button>`;
  q.classList.add("on");
  $("askY").onclick=()=>{q.classList.remove("on");setR(d.id,"nosel",true);toast("Marcado: correo de no selección enviado");if($("dr").classList.contains("on"))openRow(d.id);else render();};
  $("askN").onclick=()=>q.classList.remove("on");
}
function discard(d,after){
  const q=$("ask"), r=R(d);
  q.innerHTML=`<div class="dq"><div><b>¿Por qué no quedó ${esc(nice(d.emp))}?</b></div>
    <select id="dqm" class="sel">${MOTIVOS.map(m=>`<option ${r.motivo&&r.motivo.startsWith(m)?"selected":""}>${m}</option>`).join("")}</select>
    <input id="dqt" class="sel" placeholder="Detalle (opcional)" value="${esc(r.motivoDet||"")}">
    <div class="dqb"><button class="btn" id="dqn">Cancelar</button><button class="btn wine" id="dqy">Descartar</button></div></div>`;
  q.classList.add("on","big"); setTimeout(()=>$("dqm").focus(),50);
  $("dqn").onclick=()=>q.classList.remove("on","big");
  $("dqy").onclick=()=>{const m=$("dqm").value, t=$("dqt").value.trim();
    if(m==="Otro motivo"&&!t){toast("Escribe el motivo");$("dqt").focus();return;}
    setR(d.id,"motivo",m==="Otro motivo"?t:m); setR(d.id,"motivoDet",m==="Otro motivo"?"":t); setR(d.id,"st","nq");
    q.classList.remove("on","big"); if(after)after(); else render();
    toast(`${nice(d.emp)} no quedó · entró el siguiente de la lista`,3500);};
}
const motivoTxt=r=>r.motivo?(r.motivo+(r.motivoDet?` (${r.motivoDet})`:"")):"sin motivo registrado";
function markSent(d,kind){
  if(kind==="mail"){ setR(d.id,"msent",true); if(["pend","port","rec"].includes(R(d).st)) setR(d.id,"st","env"); }
  else { setR(d.id,"sent",true); if(R(d).st==="pend") setR(d.id,"st","port"); }
  render();
}
function askSent(d,kind){
  const q=$("ask"); const what=kind==="mail"?"el correo":"el WhatsApp";
  q.innerHTML=`<span>¿Enviaste ${what} a <b>${esc(nice(d.emp))}</b>?</span><button class="btn wine" id="askY">Sí, lo envié</button><button class="btn" id="askN">No</button>`;
  q.classList.add("on");
  $("askY").onclick=()=>{q.classList.remove("on");markSent(d,kind);toast(kind==="mail"?"Marcado como correo enviado":"Marcado como WhatsApp enviado");};
  $("askN").onclick=()=>q.classList.remove("on");
}

function setupView(){
  $("setup").innerHTML=`<div class="sv">
    <div class="sv-k">Feria de Emprendimiento TP 2026</div>
    <h1>Bienvenida a <em>Misión Emprende</em></h1>
    <p>Escribe la clave del equipo para ver los emprendimientos. Solo se pide una vez en este computador.</p>
    <form class="sv-key" id="svf">
      <input id="svk" type="password" placeholder="Clave del equipo" autocomplete="off">
      <button class="btn wine" type="submit">Entrar</button>
    </form>
    <div class="sv-msg" id="svm">${viejo?"El Apps Script del Sheet no está actualizado, así que no puede revisar la clave. Pega el código nuevo y publica una nueva versión.":claveMala?"Esa clave no es correcta. Revísala e intenta de nuevo.":""}</div></div>`;
  $("svf").onsubmit=async ev=>{ev.preventDefault();const k=$("svk").value.trim();if(!k)return;
    CLAVE=k;try{localStorage.setItem(CKEY,k);}catch(e){}
    $("svm").textContent="Cargando emprendimientos…";
    const ok=await pull(); if(!ok&&!claveMala){$("svm").textContent=diag==="html"?"El Apps Script respondió con un error. Revisa que el código nuevo esté guardado y publicado como nueva versión.":"No se pudo conectar con el Apps Script. Revisa que esté implementado como Aplicación web con acceso para «Cualquier persona».";} if(ok)render(); if(ok&&!DATA.length){$("svm").textContent="La conexión funciona, pero el Sheet no tiene emprendimientos en la hoja Base.";} if(ok) push();};
  setTimeout(()=>{const k=$("svk");if(k)k.focus();},50);
}
function importBase(f){
  if(!f) return; const rd=new FileReader();
  rd.onload=()=>{try{const arr=JSON.parse(rd.result); if(!Array.isArray(arr)||!arr[0]||!arr[0].emp) throw 0;
    setBase(arr); pendingBase=arr; persist(); render(); toast(`Base cargada: ${arr.length} emprendimientos`); if(S.g.url) push(); }
    catch(e){toast("Ese archivo no es la base de emprendimientos");}};
  rd.readAsText(f);
}

  $("list").querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{setR(+b.dataset.back,"st","pend");render();toast("Lo volviste a tener en cuenta");});
  $("list").querySelectorAll("select[data-st]").forEach(s=>s.onchange=()=>{setR(+s.dataset.st,"st",s.value);render();});
}
const stSel=(d,cls="")=>{const r=R(d);return `<select class="stsel s-${r.st} ${cls}" data-st="${d.id}" title="Estado">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${r.st===k?"selected":""}>${l}</option>`).join("")}</select>`;};
function row(d,n,why){

const PATS=[["stock",/productos listos|exhibir/i],["part",/confirmas|participaci/i],["atel",/celular/i],["paren",/parentesco/i],["corr",/corregir|correcci/i],["camp",/campa[ñn]a/i],["hor",/horario/i],["apoyo",/acompa[ñn]ante|persona que atender|nombre completo|atender[aá] tu stand/i]];
function parseReply(txt){
  const out={};
  txt.split(/\r?\n/).forEach(line=>{
    const m=line.replace(/^[\s>]+/,"").match(/^([^:]{3,80}):\s*(.*)$/); if(!m) return;
    const lab=m[1], val=m[2].trim(); if(!val||/^(si aplica|n\/?a)$/i.test(val)&&false) return;
    if(!val) return;
    for(const [k,re] of PATS){ if(re.test(lab)){ if(!(k in out)) out[k]=val; break; } }
  });
  if(out.corr&&/^(ninguno|ninguna|no|n\/a|na|todo bien|todo est[aá] bien|ok)\.?$/i.test(out.corr)) out.corr="";
  return out;
}
function detect(txt){
  const t=txt.toLowerCase(); let best=null,bs=0;
  DATA.forEach(d=>{let s=0; if(d.email&&t.includes(d.email.toLowerCase()))s+=5; if(t.includes(nice(d.emp).toLowerCase()))s+=4; if(t.includes(d.nombre.toLowerCase()))s+=3; if(d.site===site)s+=.5; if(s>bs){bs=s;best=d;}});
  return bs>=3?best:null;
}

function excelSite(s){
  const {conf,pend,nq,decl}=siteSets(s);
  const ficha=d=>{const r=R(d);return {"Emprendimiento":nice(d.emp),"Categoría":d.sub,"Colaborador":d.nombre,"Celular":d.tel,"Correo":d.email,"Estado":ST[r.st],"Productos para exhibir":r.stock||"","Campaña":r.camp,"Horario":r.hor,"Acompañante (atiende el stand)":r.apoyo,"Celular acompañante":r.atel,"Parentesco":r.paren,"Correcciones":r.corr};};
  const hojas=[["Confirmados",conf.map(ficha)],["En proceso",pend.map(ficha)],["No quedaron",nq.map(d=>({"Emprendimiento":nice(d.emp),"Categoría":d.sub,"Colaborador":d.nombre,"Motivo":motivoTxt(R(d))})).concat(decl.map(d=>({"Emprendimiento":nice(d.emp),"Categoría":d.sub,"Colaborador":d.nombre,"Motivo":"No va a participar"})))]].filter(h=>h[1].length);
  if(!hojas.length){toast(`Aún no hay información para reportar en ${s}`);return;}
  const name=`Feria_TP_2026_${s.replace(/\s/g,"")}`;
  if(window.XLSX){const wb=XLSX.utils.book_new();hojas.forEach(([n,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=Object.keys(rows[0]).map(k=>({wch:Math.min(60,Math.max(k.length,...rows.map(r=>String(r[k]||"").length))+2)}));XLSX.utils.book_append_sheet(wb,ws,n);});XLSX.writeFile(wb,name+".xlsx");}
  else{const rows=hojas.flatMap(([n,r])=>r.map(x=>Object.assign({"Lista":n},x)));const k=[...new Set(rows.flatMap(Object.keys))];const csv="﻿"+[k].concat(rows.map(r=>k.map(x=>r[x]))).map(x=>x.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");const a2=document.createElement("a");a2.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a2.download=name+".csv";a2.click();}
}
function resumen(s){
  const {sel,nq,decl}=siteSets(s), out=[];
  const food=sel.filter(d=>d.food), post=sel.filter(esPostre);
  if(food.length) out.push(`De los ${sel.length} emprendimientos seleccionados, ${food.length} ${food.length===1?"es":"son"} de alimentos${post.length?` (${post.length} de postres)`:""}.`);
  const cats={}; sel.forEach(d=>cats[d.sub]=(cats[d.sub]||0)+1); const top=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
  if(top&&top[1]>=3) out.push(`La categoría con más emprendimientos es ${top[0].toLowerCase()} (${top[1]}).`);
  if(nq.length){const m={};nq.forEach(d=>{const k=R(d).motivo||"sin motivo";m[k]=(m[k]||0)+1;});const tm=Object.entries(m).sort((x,y)=>y[1]-x[1])[0];
    out.push(tm[1]>1?`${nq.length} emprendimientos no quedaron; el motivo más frecuente fue: ${tm[0].charAt(0).toLowerCase()+tm[0].slice(1)} (${tm[1]}).`:`${nq.length} ${nq.length===1?"emprendimiento no quedó":"emprendimientos no quedaron"} (los motivos están en la lista de arriba).`);}
  if(decl.length) out.push(`${decl.length} ${decl.length===1?"emprendedor indicó":"emprendedores indicaron"} que no va${decl.length===1?"":"n"} a participar.`);
  if(sel.length<META) out.push(`Por ahora solo hay ${sel.length} de ${META} cupos con opciones disponibles.`);
  return out;
}
function isaText(s){
  const {conf,pend,nq}=siteSets(s);
  const L=[];
  L.push("Hola Isa, ¿cómo estás?","",`Te compartimos el avance de los emprendimientos del site ${s}. Adjuntamos el Excel con el detalle.`,"");
  L.push(`Confirmados (${conf.length}):`); L.push(conf.length?conf.map((d,i)=>`${i+1}. ${nice(d.emp)} · ${d.nombre}${R(d).apoyo?` (atiende: ${R(d).apoyo})`:""}`).join("\n"):"Aún no hay confirmados.");
  if(pend.length){L.push("",`En proceso (${pend.length}):`,pend.map(d=>`- ${nice(d.emp)} · ${ST[R(d).st].toLowerCase()}`).join("\n"));}
  if(nq.length){L.push("",`No quedaron (${nq.length}):`,nq.map(d=>`- ${nice(d.emp)} (${d.sub.toLowerCase()}): ${motivoTxt(R(d))}${R(d).nosel?" · ya se le notificó":""}`).join("\n"));}
  const res=resumen(s); if(res.length){L.push("","Resumen:",res.map(x=>`- ${x}`).join("\n"));}
  L.push("","Quedamos atentas a los horarios y a la fecha en que se realizará la feria para continuar con la organización.","","¡Gracias!");
  return L.join("\n");
}

/* ---------- Drive sync ---------- */
let syncT=null, syncing=false;
function setSync(cls,txt){const b=$("syncBtn");b.className="sync "+cls;$("syncTxt").textContent=txt;}
function table(){
  const H=["Site","#","Emprendimiento","Colaborador","Celular","Correo","Categoría","Nota","Productos para exhibir","Campaña","Horario","Acompañante (atiende el stand)","Celular acompañante","Parentesco","Correcciones","Estado","WhatsApp enviado","Correo enviado","ID","Motivo descarte","Correo de no selección"];
  const rows=[H];
  SITES.forEach(s=>{const {sel,more}=lists(s);sel.concat(more).forEach((d,i)=>{const r=R(d);rows.push([s,i+1,nice(d.emp),d.nombre,d.tel,d.email,d.sub,d.nota||"",r.stock||"",r.camp,r.hor,r.apoyo,r.atel,r.paren,r.corr,ST[r.st],r.sent?"Sí":"",mailSent(r)?"Sí":"",String(d.id),r.st==="nq"?motivoTxt(r):"",r.nosel?"Enviado":""]);});});
  return rows;
}
function merge(resp){
  if(!resp) return;
  if(Array.isArray(resp.base)&&resp.base.length&&!pendingBase) setBase(resp.base);
  const remote=resp.state||resp;
  const pick=(loc,rem)=>{Object.keys(rem||{}).forEach(k=>{if(!loc[k]||(rem[k].ts||0)>(loc[k].ts||0))loc[k]=rem[k];});};
  pick(S.r,remote.r); pick(S.c,remote.c);
  if(remote.g&&(remote.g.ts||0)>(S.g.ts||0)) S.g=Object.assign({},remote.g,{url:S.g.url});
  rebuild(); persist();
}
async function pull(){
  if(!S.g.url||!CLAVE) return false;
  let res,j;
  try{setSync("busy","Sincronizando…");res=await fetch(S.g.url+(S.g.url.includes("?")?"&":"?")+"k="+encodeURIComponent(CLAVE));}
  catch(e){diag="red";setSync("err","Sin conexión con Drive");return false;}
  try{j=await res.json();}catch(e){diag="html";setSync("err","El Apps Script respondió con error");return false;}
  diag="";
  try{
    if(j.error==="clave"||j.auth!==true){claveMala=true;viejo=j.auth!==true&&j.error!=="clave";S.ok="";persist();setSync("err",viejo?"Apps Script sin actualizar":"Clave incorrecta");render();return false;}
    claveMala=false;viejo=false;S.ok=CLAVE;merge(j);limpieza1();setSync("on","Guardado en Drive");if(!$("dr").classList.contains("on"))render();return true;}
  catch(e){setSync("err","Sin conexión con Drive");return false;}
}
async function push(){
  if(!S.g.url||!CLAVE||syncing) return; syncing=true;
  try{setSync("busy","Guardando…");const payload=JSON.stringify(Object.assign({k:CLAVE,state:{r:S.r,c:S.c,g:Object.assign({},S.g,{url:undefined})},table:DATA.length?table():null},pendingBase?{base:pendingBase}:{}));
    const res=await fetch(S.g.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload});
    pendingBase=null;
    try{merge(await res.json());}catch(e){}
    setSync("on","Guardado en Drive · "+new Date().toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}));}
  catch(e){setSync("err","No se pudo guardar en Drive");}
  syncing=false;
}
function queueSync(){if(!S.g.url||!CLAVE)return;clearTimeout(syncT);setSync("busy","Cambios sin guardar…");syncT=setTimeout(push,1500);}
$("syncBtn").onclick=()=>{
  open(`<div class="dh"><div class="lb">Respaldo</div><h3>Google Drive</h3><p>Todo se guarda en un Google Sheet y se actualiza para quien abra la app.</p><button class="ic x">${IC.x}</button></div>
   <div class="db">
     <div class="blk"><h4>Configuración · una sola vez</h4><ol class="steps">
       <li>Crea un Google Sheet nuevo en tu Drive, por ejemplo "Misión Emprende 2026".</li>
       <li>En el Sheet ve a <b>Extensiones › Apps Script</b>, borra lo que aparece y pega el código.</li>
       <li>Toca <b>Implementar › Nueva implementación</b>, elige <b>Aplicación web</b>, en "Quién tiene acceso" selecciona <b>Cualquier persona</b> e implementa. Autoriza los permisos.</li>
       <li>Copia la URL de la aplicación web y pégala aquí abajo.</li></ol>
       <button class="btn" id="gscopy" style="width:100%;height:42px">${IC.copy}Copiar código de Apps Script</button></div>
     <div class="blk"><h4>Clave del equipo</h4><div class="fl"><input id="gskey" value="${esc(CLAVE)}"></div><div class="note" style="margin-top:6px">Se cambia en la hoja oculta "_config" del Sheet (celda B1).</div></div>
     <div class="blk"><h4>URL de la aplicación web</h4><div class="fl"><input id="gsurl" value="${esc(S.g.url||"")}" placeholder="https://script.google.com/macros/s/…/exec"></div>
       <div class="note" style="margin-top:6px">Comparte esta misma URL con Nicolly y Asley para que trabajen sobre los mismos datos. En el Sheet verás la hoja "Seguimiento" con todo actualizado.</div></div>
     <div class="blk"><h4>Base de emprendimientos</h4><div class="note" style="margin-bottom:8px">${DATA.length?`Cargada: ${DATA.length} emprendimientos.`:"Aún no hay base cargada."} Para reemplazarla, sube un nuevo archivo base_emprendimientos.json.</div>
       <label class="btn" style="cursor:pointer;width:100%;height:42px">${IC.dl}Subir base<input type="file" id="gsbase" accept=".json,application/json" hidden></label></div>
   </div>
   <div class="df"><button class="btn" id="gsoff">Cerrar sesión</button><button class="btn wine" id="gson">Guardar y sincronizar</button></div>`);
  $("gscopy").onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(APPS_SCRIPT):Promise.reject()).then(()=>toast("Código copiado")).catch(()=>{const t=document.createElement("textarea");t.value=APPS_SCRIPT;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast("Código copiado");});};
  $("gson").onclick=async()=>{const u=$("gsurl").value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){toast("Pega la URL que termina en /exec");return;}S.g.url=u;CLAVE=$("gskey").value.trim();try{localStorage.setItem(CKEY,CLAVE);}catch(e){}persist();close();await pull();await push();render();};
  $("gsbase").onchange=e=>{importBase(e.target.files[0]);close();};
  $("gsoff").onclick=()=>{CLAVE="";try{localStorage.removeItem(CKEY);localStorage.removeItem(BKEY);}catch(e){}DATA=[];close();render();};
};

let tt=null;
function limpieza1(){
  if(S.g.limpieza1) return;
  Object.keys(S.r).forEach(k=>{const r=S.r[k]; if(!r) return; let ch=false;
    if(r.sent){r.sent=false;ch=true;} if(r.msent){r.msent=false;ch=true;}
    if(["env","port","nores"].includes(r.st)){r.st="pend";ch=true;}
    if(ch) r.ts=now();});
  S.g.limpieza1=true; S.g.ts=now(); save();
}
function toast(t,ms=1800){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),ms);}
render();
if(S.g.url&&CLAVE){pull();setInterval(()=>{if(!syncing&&!$("dr").classList.contains("on"))pull();},45000);window.addEventListener("focus",()=>{if(!$("dr").classList.contains("on"))pull();});}
